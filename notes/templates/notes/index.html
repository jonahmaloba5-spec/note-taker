{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/notes.css' %}">
    <title>LyxScript Note Taker v0.07</title>
    </head>
<body>
    <div class="container">
        <div class="header">
            <h1>LyxScript Note Taker</h1>
            <div class="version">v0.07 - Fully Offline</div>
        </div>

        <div id="statusContainer"></div>

        <div class="app-grid">
            <div class="creation-panel">
                <div class="panel-title">
                    <i class="fa fa-plus"></i>
                    Create New Note
                </div>
                
                <form id="noteForm">
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" 
                               id="author" 
                               class="form-input" 
                               placeholder="Enter your name"
                               maxlength="30"
                               required>
                    </div>
                    
                    <div class="form-group">
                        <label for="note">Note Content</label>
                        <textarea 
                            id="note" 
                            class="form-input" 
                            placeholder="Start typing your note here..."
                            required></textarea>
                    </div>
                    
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary" id="saveNoteBtn">
                            <i class="fa fa-database"></i>
                            Save Note
                        </button>
                        <button type="button" class="btn btn-danger" id="clearFormBtn">
                            <i class="fa fa-times"></i>
                            Clear
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="notes-panel">
                <div class="notes-header">
                    <div class="panel-title">
                        <i class="fa fa-sticky-note"></i>
                        Recent Notes
                    </div>
                    <button class="refresh-btn" id="refreshNotesBtn">
                        <i class="fa fa-refresh"></i>
                        Refresh
                    </button>
                </div>
                
                <div class="notes-container" id="notesContainer">
                    <div class="empty-state">
                        <i class="fa fa-sticky-note"></i>
                        <h3>No Notes Yet</h3>
                        <p>Create your first note to see it here!</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>LyxScript Note Taker v0.07 • Fully Offline • Data stored locally</p>
            <p>Total Notes: <span id="noteCount">0</span></p>
        </div>
    </div>
      <script src="{% static 'js/notes.js' %}"></script>
    </body>
</html>
